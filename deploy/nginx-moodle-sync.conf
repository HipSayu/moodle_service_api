# nginx đứng trước container moodle-sync: thêm đăng nhập và (tùy chọn) HTTPS.
# Chép vào /etc/nginx/sites-available/moodle-sync rồi làm theo DEPLOY.md mục 6.
server {
    listen 80;
    server_name sync.example.huce.edu.vn;   # đổi thành tên miền hoặc IP của máy chủ

    # Service không có đăng nhập riêng nên chặn ngay ở nginx
    auth_basic           "Moodle Sync";
    auth_basic_user_file /etc/nginx/.htpasswd-moodle-sync;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:4207;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Đồng bộ cả học kỳ chạy trong một request, có thể mất hàng chục phút.
        # Mặc định nginx cắt sau 60 giây và trả 504 dù service vẫn đang chạy.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
